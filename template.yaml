AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Dice Roll API - A serverless API that rolls dice

Globals:
  Function:
    Timeout: 5
    MemorySize: 128
    Tracing: Active

Resources:
  DiceApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      TracingEnabled: true
      Cors:
        AllowMethods: "'GET,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingBurstLimit: 20
          ThrottlingRateLimit: 10
          MetricsEnabled: true
          LoggingLevel: INFO
          DataTraceEnabled: false

  DiceApiWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: dice-roller-api-waf
      Scope: REGIONAL
      Description: Rate-limit Dice Roller API to block bill-DoS
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: dice-roller-api-waf
      Rules:
        - Name: RateLimit500Per5MinPerIP
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 500
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: dice-roller-rate-limit

  DiceApiWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    # The association targets the Prod stage ARN, so the stage
    # (generated by SAM from DiceApi) must exist before associating.
    DependsOn:
      - DiceApi
      - DiceApiWebACL
      - DiceApiProdStage
    Properties:
      ResourceArn: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${DiceApi}/stages/Prod
      WebACLArn: !GetAtt DiceApiWebACL.Arn

  DiceRollFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: index.handler
      Runtime: nodejs24.x
      CodeUri: lambda/
      Environment:
        Variables:
          ALLOWED_ORIGINS: "*"
      Events:
        RollDice:
          Type: Api
          Properties:
            RestApiId: !Ref DiceApi
            Path: /roll
            Method: get

Outputs:
  DiceRollApi:
    Description: API Gateway endpoint URL
    Value: !Sub "https://${DiceApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/roll"